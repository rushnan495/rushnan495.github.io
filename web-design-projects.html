<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Projects | EDU SPORTS IT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:'Segoe UI',sans-serif; padding:20px; background:#020617; color:#fff;}
.project{background:#0f172a; padding:15px; margin-bottom:15px; border-radius:8px;}
.locked{opacity:0.5;}
.check{color:#4ade80; font-weight:bold; margin-left:10px;}
</style>
</head>
<body>
<h1>My Projects</h1>

<div id="project1" class="project">
  <strong>Project 1: Portfolio</strong> <span id="p1status"></span>
</div>

<div id="project2" class="project locked">
  <strong>Project 2: Online Shopping</strong> <span id="p2status"></span>
</div>

<div id="project3" class="project locked">
  <strong>Project 3: Mini Social Media</strong> <span id="p3status"></span>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

const firebaseConfig={
  apiKey:"AIzaSyDR5yywOyYjCSnfTyLTcMUIz-hG80jZXU4",
  databaseURL:"https://edu-sports-it-default-rtdb.firebaseio.com",
  projectId:"edu-sports-it"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);
const userId="demoUser123";

const userRef=ref(db,"users/"+userId);
onValue(userRef,(snapshot)=>{
  const data=snapshot.val();
  if(data.project1){
    document.getElementById("p1status").textContent="✔️ Completed";
    document.getElementById("project2").classList.remove("locked");
  } else {
    document.getElementById("p1status").textContent="❌ Locked";
  }
  if(data.project2){
    document.getElementById("p2status").textContent="✔️ Completed";
    document.getElementById("project3").classList.remove("locked");
  } else {
    document.getElementById("p2status").textContent="❌ Locked";
  }
  if(data.project3){
    document.getElementById("p3status").textContent="✔️ Completed";
  } else {
    document.getElementById("p3status").textContent="❌ Locked";
  }
});
</script>
</body>
</html>
