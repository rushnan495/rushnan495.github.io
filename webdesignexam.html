<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Project 1 — Portfolio Website</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:#020617;
  color:#fff;
}
.main{
  display:flex;
  height:100vh;
}

/* LEFT */
.left{
  width:25%;
  background:#0f172a;
  padding:20px;
}
.left h2{color:#38bdf8}
.rule{margin:8px 0}

/* CENTER */
.center{
  width:35%;
  background:#020617;
}
textarea{
  width:100%;
  height:100%;
  background:#020617;
  color:#e5e7eb;
  border:none;
  padding:15px;
  font-family:monospace;
  font-size:14px;
}

/* RIGHT */
.right{
  width:40%;
  background:#fff;
}
iframe{
  width:100%;
  height:100%;
  border:none;
}

.bad{color:#f87171}
.good{color:#4ade80}
</style>
</head>

<body>

<div class="main">

<!-- INSTRUCTIONS -->
<div class="left">
<h2>📘 Project: Portfolio</h2>

<div class="rule" id="r1">❌ h1 with your name</div>
<div class="rule" id="r2">❌ paragraph about you</div>
<div class="rule" id="r3">❌ button "Contact Me"</div>
<div class="rule" id="r4">❌ center all content</div>
</div>

<!-- CODE EDITOR -->
<div class="center">
<textarea id="code">
<!DOCTYPE html>
<html>
<head>
<style>
body{
  font-family:Arial;
}
</style>
</head>
<body>

<!-- Your code here -->

</body>
</html>
</textarea>
</div>

<!-- PREVIEW -->
<div class="right">
<iframe id="preview"></iframe>
</div>

</div>

<script>
const textarea = document.getElementById("code");
const iframe = document.getElementById("preview");

function updatePreview(){
  iframe.srcdoc = textarea.value;
  runTests();
}

textarea.addEventListener("input", updatePreview);
updatePreview();

function runTests(){
  const doc = iframe.contentDocument || iframe.contentWindow.document;

  let pass = 0;

  // Test 1: h1
  const h1 = doc.querySelector("h1");
  toggle("r1", !!h1);

  // Test 2: p
  const p = doc.querySelector("p");
  toggle("r2", !!p);

  // Test 3: button
  const btn = [...doc.querySelectorAll("button")]
    .find(b=>b.textContent.toLowerCase().includes("contact"));
  toggle("r3", !!btn);

  // Test 4: center
  const bodyStyle = doc.body.style.textAlign === "center";
  toggle("r4", bodyStyle);

  if(document.querySelectorAll(".good").length === 4){
    setTimeout(()=>alert("🎉 Congratulations! Project Completed 100%!"),500);
  }
}

function toggle(id, ok){
  const el = document.getElementById(id);
  if(ok){
    el.textContent = el.textContent.replace("❌","✔️");
    el.className="rule good";
  }else{
    el.textContent = el.textContent.replace("✔️","❌");
    el.className="rule bad";
  }
}
</script>

</body>
</html>
